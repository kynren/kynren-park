# Admin console — reverse proxy to the `admin` container (127.0.0.1:3000).
# Place in /etc/nginx/sites-available/, symlink into sites-enabled/, then run
# certbot (see DEPLOY-VPS.md) which rewrites this block to add TLS + the :443
# server and an HTTP→HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name app-park.kynren.com;

    # Let the admin serve reasonably large uploads (base64 map/marker images).
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket / HMR upgrade headers (harmless in prod, needed if used).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
