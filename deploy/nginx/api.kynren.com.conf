# API — reverse proxy to the `api` container (127.0.0.1:4000).
# The admin (and the mobile app) call this over HTTPS from the browser/device,
# so it needs its own TLS cert. Place in sites-available/, symlink, run certbot.

server {
    listen 80;
    listen [::]:80;
    server_name api.kynren.com;

    # base64 image uploads from the admin can be a few MB; the API allows 25mb.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Socket.IO realtime (live schedule board / announcements) needs upgrade.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
