# Self-contained stack for self-hosting: Postgres + Redis + API + Admin.
# For a managed database (Prisma Postgres / Neon), drop the `postgres` service
# and set DATABASE_URL to the provider's URL in `.env`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kynren
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback-only: reachable by the api container over the compose network,
    # never exposed to the public internet.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d kynren']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      # Override in .env to use a managed database (Prisma Postgres / Neon).
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/kynren?schema=public}
      REDIS_URL: redis://redis:6379
      API_PORT: '4000'
      # Comma-separated public origins allowed to call the API (the admin domain).
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      TICKET_QR_SECRET: ${TICKET_QR_SECRET:-change-me-ticket}
    depends_on:
      postgres:
        condition: service_healthy
    # Loopback-only: Nginx on the host reverse-proxies to it with TLS.
    ports:
      - '127.0.0.1:4000:4000'

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        # Point the admin build at the public URL browsers will use to reach the API.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - api
    # Loopback-only: Nginx on the host reverse-proxies to it with TLS.
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  pgdata:
