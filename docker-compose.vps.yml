name: kynren-park

# Kynren admin + API for the shared Hostinger VPS (168.231.115.199), which also
# hosts the Asset Register app behind a Caddy reverse proxy. These containers
# join the existing Caddy network so the proxy reaches them by name; no host
# ports are bound, so nothing collides with the other stacks.
#
# Caddy (in /root/kynren-asset-register/Caddyfile) routes:
#   app-park.kynren.com {
#       @kynrenapi path /api/* /socket.io/*
#       handle @kynrenapi { reverse_proxy kynren-api:4000 }
#       handle           { reverse_proxy kynren-admin:3000 }
#   }
# so the admin and API are same-origin (no CORS, one domain, one TLS cert).
#
# Redeploy after pushing changes:
#   cd /root/kynren-park && git pull \
#     && docker compose -f docker-compose.vps.yml build \
#     && docker compose -f docker-compose.vps.yml up -d

services:
  redis:
    image: redis:7-alpine
    container_name: kynren-redis
    restart: unless-stopped
    networks: [assetnet]

  # Self-hosted, replacing Prisma's hosted "Prisma Postgres" (db.prisma.io) after that account
  # hit a plan limit and started rejecting all connections. Named park-postgres (not postgres) —
  # kynren-asset-register already runs its own service literally named "postgres" on this same
  # shared assetnet network, and reusing that name would collide. No host port is published
  # (unlike asset-register's postgres) since nothing here needs host-side CLI access to it.
  park-postgres:
    image: postgres:16-alpine
    container_name: kynren-park-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PARK_POSTGRES_USER:-kynren_park}
      POSTGRES_PASSWORD: ${PARK_POSTGRES_PASSWORD:?set PARK_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${PARK_POSTGRES_DB:-kynren_park}
    volumes:
      - park_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PARK_POSTGRES_USER:-kynren_park} -d ${PARK_POSTGRES_DB:-kynren_park}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [assetnet]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kynren-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://kynren-redis:6379
      API_PORT: "4000"
      CORS_ORIGINS: ${CORS_ORIGINS}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      TICKET_QR_SECRET: ${TICKET_QR_SECRET}
      # Public URL used in staff-invite email links.
      PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-https://app-park.kynren.com}
      # SMTP for staff-invite emails (reused from the Asset Register mailbox).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Smeetz ticketing (server-side only). Production key — see .env.
      SMEETZ_API_URL: ${SMEETZ_API_URL:-https://services.test.smeetz.com}
      SMEETZ_API_KEY: ${SMEETZ_API_KEY:-}
    depends_on:
      redis:
        condition: service_started
      park-postgres:
        condition: service_healthy
    networks: [assetnet]
    expose: ["4000"]

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: kynren-admin
    restart: unless-stopped
    depends_on: [api]
    networks: [assetnet]
    expose: ["3000"]

networks:
  assetnet:
    external: true
    name: kynren-asset-register_default

volumes:
  park_postgres_data:
